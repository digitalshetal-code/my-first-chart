<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>XAUUSD Fast Custom Chart</title>
  <!-- TradingView Lightweight Charts Library -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; height: 100vh; overflow: hidden; }
    #header { height: 48px; background: #1e222d; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #2a2e39; justify-content: space-between; }
    .symbol { font-size: 16px; font-weight: bold; color: #ffb74d; display: flex; align-items: center; gap: 8px; }
    .controls { display: flex; gap: 8px; }
    button { background: #2962ff; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; }
    button:active { opacity: 0.8; }
    #chart-container { width: 100vw; height: calc(100vh - 48px); }
    .badge { background: #ff9800; color: #000; font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 3px; }
  </style>
</head>
<body>

  <div id="header">
    <div class="symbol">
      <span>GOLD / USD (XAUUSD)</span>
      <span class="badge">FAST STREAM</span>
    </div>
    <div class="controls">
      <button onclick="toggleIndicator()">Toggle Custom Indicator (EMA 20)</button>
    </div>
  </div>

  <div id="chart-container"></div>

  <script>
    // 1. Chart Container Options Setup
    const chartContainer = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: {
        backgroundColor: '#131722',
        textColor: '#d1d4dc',
      },
      grid: {
        vertLines: { color: '#2a2e39' },
        horzLines: { color: '#2a2e39' },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
      },
      rightPriceScale: {
        borderColor: '#2a2e39',
      },
      timeScale: {
        borderColor: '#2a2e39',
        timeVisible: true,
        secondsVisible: true,
      },
    });

    // 2. Add Candlestick Series
    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981',
      downColor: '#f23645',
      borderDownColor: '#f23645',
      borderUpColor: '#089981',
      wickDownColor: '#f23645',
      wickUpColor: '#089981',
    });

    // 3. Add Custom Indicator Line (Exponential Moving Average - EMA 20)
    const emaLine = chart.addLineSeries({
      color: '#2196f3',
      lineWidth: 2,
      title: 'EMA 20',
    });

    let indicatorVisible = true;
    function toggleIndicator() {
      indicatorVisible = !indicatorVisible;
      emaLine.applyOptions({ visible: indicatorVisible });
    }

    // Tab Screen Size Adjustments
    window.addEventListener('resize', () => {
      chart.applyOptions({ 
        width: chartContainer.clientWidth, 
        height: chartContainer.clientHeight 
      });
    });

    // 4. Fetch XAUUSD Historical & Real-Time Data Stream
    // Demo API Key for TwelveData Forex Stream
    const API_KEY = 'demo'; // Free Key (Professional use ke liye aap Twelvedata/Polygon.io ki free key le sakte hain)

    async function loadXauusdData() {
      try {
        // Fetch Historical 1-Min Data for XAU/USD
        const response = await fetch(`https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1min&outputsize=150&apikey=${API_KEY}`);
        const result = await response.json();

        if (result.values) {
          const rawData = result.values.reverse();
          const formattedCandles = rawData.map(d => ({
            time: new Date(d.datetime).getTime() / 1000,
            open: parseFloat(d.open),
            high: parseFloat(d.high),
            low: parseFloat(d.low),
            close: parseFloat(d.close),
          }));

          candleSeries.setData(formattedCandles);

          // Calculate Custom EMA Indicator Logic
          calculateEMA(formattedCandles, 20);
        }
      } catch (err) {
        console.log("Error loading XAUUSD data: ", err);
      }

      // Connect Realtime WebSocket for XAUUSD Ticks
      connectXauusdSocket();
    }

    // Exponential Moving Average (EMA) Calculation Logic
    function calculateEMA(candles, period) {
      const emaData = [];
      const k = 2 / (period + 1);
      let ema = candles[0].close;

      for (let i = 0; i < candles.length; i++) {
        const close = candles[i].close;
        ema = (close * k) + (ema * (1 - k));
        if (i >= period) {
          emaData.push({ time: candles[i].time, value: ema });
        }
      }
      emaLine.setData(emaData);
    }

    // 5. WebSocket Connection for Zero Latency Forex Ticks
    function connectXauusdSocket() {
      const ws = new WebSocket(`wss://ws.twelvedata.com/v1/quotes/price?apikey=${API_KEY}`);

      ws.onopen = () => {
        // Subscribe to XAUUSD Realtime Feed
        ws.send(JSON.stringify({
          "action": "subscribe",
          "params": {
            "symbols": "XAU/USD"
          }
        }));
      };

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.event === 'price' && data.symbol === 'XAU/USD') {
          const price = parseFloat(data.price);
          const currentTime = Math.floor(data.timestamp);

          // Realtime Tick Price Update on Candle
          candleSeries.update({
            time: currentTime,
            close: price,
          });
        }
      };
    }

    loadXauusdData();
  </script>
</body>
</html>
