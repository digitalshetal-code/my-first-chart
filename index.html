<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Market Chart</title>
  <!-- Stable Lightweight Charts Library -->
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background-color: #131722; color: #d1d4dc; margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
    #header { height: 50px; background: #1e222d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #2a2e39; }
    .title { font-size: 15px; font-weight: bold; color: #00e676; }
    #chart-container { width: 100vw; height: calc(100vh - 50px); }
  </style>
</head>
<body>

  <div id="header">
    <div class="title">PAXG/USDT (Gold Live Stream)</div>
  </div>

  <div id="chart-container"></div>

  <script>
    // 1. Chart Init
    const chartContainer = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
      timeScale: { timeVisible: true, secondsVisible: true }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981',
      downColor: '#f23645',
      borderDownColor: '#f23645',
      borderUpColor: '#089981',
      wickDownColor: '#f23645',
      wickUpColor: '#089981',
    });

    // 2. Fetch Real Historical Candles from Binance
    async function loadRealData() {
      try {
        const response = await fetch('https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=1m&limit=200');
        const rawData = await response.json();
        
        const formattedData = rawData.map(d => ({
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));

        candleSeries.setData(formattedData);
        chart.timeScale().fitContent();

        // Start Live WebSocket Stream after loading history
        startLiveStream();
      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    // 3. Live WebSocket Connection
    function startLiveStream() {
      const ws = new WebSocket('wss://stream.binance.com:9443/ws/paxgusdt@kline_1m');

      ws.onmessage = function(event) {
        const message = JSON.parse(event.data);
        const kline = message.k;

        const liveCandle = {
          time: Math.floor(kline.t / 1000),
          open: parseFloat(kline.o),
          high: parseFloat(kline.h),
          low: parseFloat(kline.l),
          close: parseFloat(kline.c)
        };

        candleSeries.update(liveCandle);
      };
    }

    loadRealData();

    // Auto-resize for Tab
    window.addEventListener('resize', () => {
      chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 50 });
    });
  </script>
</body>
</html>
