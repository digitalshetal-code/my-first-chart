<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>My Ultra-Fast Trading Chart</title>
  <!-- TradingView Lightweight Charts Library (Super Fast Rendering) -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: #131722; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; height: 100vh; overflow: hidden; }
    #header { height: 48px; background: #1e222d; display: flex; align-items: center; padding: 0 16px; border-bottom: 1px solid #2a2e39; justify-content: space-between; }
    .title { font-size: 16px; font-weight: bold; color: #f0f3fa; }
    .controls { display: flex; gap: 8px; }
    button { background: #2962ff; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: 500; cursor: pointer; }
    button:active { opacity: 0.8; }
    #chart-container { width: 100vw; height: calc(100vh - 48px); }
  </style>
</head>
<body>

  <div id="header">
    <div class="title">BTC/USDT Fast Realtime Chart</div>
    <div class="controls">
      <button onclick="toggleSMA()">Toggle Custom SMA Indicator</button>
    </div>
  </div>

  <div id="chart-container"></div>

  <script>
    // 1. Chart Container Options Setup
    const chartContainer = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: {
        backgroundColor: '#131722',
        textColor: '#d1d4dc',
      },
      grid: {
        vertLines: { color: '#2a2e39' },
        horzLines: { color: '#2a2e39' },
      },
      crosshair: {
        mode: LightweightCharts.CrosshairMode.Normal,
      },
      rightPriceScale: {
        borderColor: '#2a2e39',
      },
      timeScale: {
        borderColor: '#2a2e39',
        timeVisible: true,
        secondsVisible: true,
      },
    });

    // 2. Add Candlestick Series
    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981',
      downColor: '#f23645',
      borderDownColor: '#f23645',
      borderUpColor: '#089981',
      wickDownColor: '#f23645',
      wickUpColor: '#089981',
    });

    // 3. Add Custom Indicator Line (SMA 20)
    const smaLine = chart.addLineSeries({
      color: '#ff9800',
      lineWidth: 2,
      title: 'SMA 20',
    });

    let smaVisible = true;
    function toggleSMA() {
      smaVisible = !smaVisible;
      smaLine.applyOptions({ visible: smaVisible });
    }

    // Window Resize Handling for Tab Screen
    window.addEventListener('resize', () => {
      chart.applyOptions({ 
        width: chartContainer.clientWidth, 
        height: chartContainer.clientHeight 
      });
    });

    // 4. Fetch Historical Data & Calculate Custom Indicator
    async function initChart() {
      // Historical K-lines (1 min interval) from Binance API
      const res = await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=200');
      const data = await res.json();
      
      const formattedCandles = data.map(d => ({
        time: d[0] / 1000,
        open: parseFloat(d[1]),
        high: parseFloat(d[2]),
        low: parseFloat(d[3]),
        close: parseFloat(d[4]),
      }));

      candleSeries.setData(formattedCandles);

      // --- CUSTOM INDICATOR LOGIC (Simple Moving Average - SMA 20) ---
      const smaData = [];
      const period = 20;
      for (let i = 0; i < formattedCandles.length; i++) {
        if (i < period - 1) continue;
        let sum = 0;
        for (let j = 0; j < period; j++) {
          sum += formattedCandles[i - j].close;
        }
        smaData.push({ time: formattedCandles[i].time, value: sum / period });
      }
      smaLine.setData(smaData);

      // 5. Connect Realtime WebSocket Feed (Zero Latency Ticks)
      connectRealtimeData();
    }

    // Realtime Tick Stream
    function connectRealtimeData() {
      const socket = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_1m');
      
      socket.onmessage = (event) => {
        const message = JSON.parse(event.data);
        const candle = message.k;
        
        const currentCandle = {
          time: candle.t / 1000,
          open: parseFloat(candle.o),
          high: parseFloat(candle.h),
          low: parseFloat(candle.l),
          close: parseFloat(candle.c),
        };

        // Realtime Candle Update
        candleSeries.update(currentCandle);
      };
    }

    initChart();
  </script>
</body>
</html>
