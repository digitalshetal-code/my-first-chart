<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Multi-Timeframe Live Chart</title>
  <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background-color: #131722; color: #d1d4dc; margin: 0; padding: 0; font-family: sans-serif; overflow: hidden; }
    #header { height: 50px; background: #1e222d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #2a2e39; }
    .title { font-size: 14px; font-weight: bold; color: #00e676; }
    .tf-buttons { display: flex; gap: 4px; }
    .tf-btn { background: #2a2e39; color: #d1d4dc; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .tf-btn.active { background: #2962ff; color: white; }
    #chart-container { width: 100vw; height: calc(100vh - 50px); }
  </style>
</head>
<body>

  <div id="header">
    <div class="title">PAXG/USDT (Gold)</div>
    <div class="tf-buttons">
      <button class="tf-btn active" onclick="changeInterval('1m', this)">1m</button>
      <button class="tf-btn" onclick="changeInterval('5m', this)">5m</button>
      <button class="tf-btn" onclick="changeInterval('15m', this)">15m</button>
      <button class="tf-btn" onclick="changeInterval('1h', this)">1h</button>
      <button class="tf-btn" onclick="changeInterval('4h', this)">4h</button>
    </div>
  </div>

  <div id="chart-container"></div>

  <script>
    // 1. Chart Init
    const chartContainer = document.getElementById('chart-container');
    const chart = LightweightCharts.createChart(chartContainer, {
      layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
      timeScale: { timeVisible: true, secondsVisible: true }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981',
      downColor: '#f23645',
      borderDownColor: '#f23645',
      borderUpColor: '#089981',
      wickDownColor: '#f23645',
      wickUpColor: '#089981',
    });

    let currentInterval = '1m';
    let ws = null;

    // 2. Load Historical Data for Selected Timeframe
    async function loadData(interval) {
      if (ws) ws.close(); // Purana websocket connection close karein

      try {
        const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=${interval}&limit=200`);
        const rawData = await response.json();
        
        const formattedData = rawData.map(d => ({
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));

        candleSeries.setData(formattedData);
        chart.timeScale().fitContent();

        // Naye timeframe ka live socket shuru karein
        startWebSocket(interval);
      } catch (err) {
        console.error("Error loading data:", err);
      }
    }

    // 3. Live WebSocket Stream for Timeframe
    function startWebSocket(interval) {
      ws = new WebSocket(`wss://stream.binance.com:9443/ws/paxgusdt@kline_${interval}`);

      ws.onmessage = function(event) {
        const message = JSON.parse(event.data);
        const kline = message.k;

        const liveCandle = {
          time: Math.floor(kline.t / 1000),
          open: parseFloat(kline.o),
          high: parseFloat(kline.h),
          low: parseFloat(kline.l),
          close: parseFloat(kline.c)
        };

        candleSeries.update(liveCandle);
      };
    }

    // 4. Handle Timeframe Button Click
    function changeInterval(interval, btn) {
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentInterval = interval;
      loadData(interval);
    }

    // Initial Load
    loadData(currentInterval);

    // Auto-resize for Tab
    window.addEventListener('resize', () => {
      chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 50 });
    });
  </script>
</body>
</html>
