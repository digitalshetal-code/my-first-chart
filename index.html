<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XAUUSD Chart</title>
  <!-- TradingView Lightweight Charts Library -->
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    body { background-color: #131722; color: #d1d4dc; margin: 0; padding: 0; font-family: sans-serif; }
    #header { height: 50px; background: #1e222d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #2a2e39; }
    .title { font-size: 15px; font-weight: bold; color: #ffb74d; }
    #chart-container { width: 100vw; height: calc(100vh - 50px); }
  </style>
</head>
<body>

  <div id="header">
    <div class="title">XAUUSD Live Chart</div>
  </div>

  <div id="chart-container"></div>

  <script>
    try {
      // 1. Chart Init
      const chartContainer = document.getElementById('chart-container');
      const chart = LightweightCharts.createChart(chartContainer, {
        layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
        grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
        timeScale: { timeVisible: true, secondsVisible: true }
      });

      const candleSeries = chart.addCandlestickSeries();

      // 2. Dummy Safe Data Load (Taaki pehle chart load ho jaye bina error ke)
      const sampleData = [
        { time: 1718000000, open: 2320, high: 2335, low: 2315, close: 2330 },
        { time: 1718000060, open: 2330, high: 2340, low: 2325, close: 2338 },
        { time: 1718000120, open: 2338, high: 2345, low: 2330, close: 2342 }
      ];
      candleSeries.setData(sampleData);

      // Window Resize Fix for Tabs
      window.addEventListener('resize', () => {
        chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 50 });
      });

    } catch (error) {
      document.body.innerHTML = "<h2 style='color:red; padding:20px;'>Error: " + error.message + "</h2>";
    }
  </script>
</body>
</html>
